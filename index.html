<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battlefield 2: Project Reality AI Remaster</title>
    
    <!-- Load the img-comparison-slider library -->
    <script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css"/>
    
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        img-comparison-slider {
            max-width: 1920px;
            width: 100%;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        img {
            width: 100%;
            height: auto;
        }
        /* Navigation Controls */
        .nav-arrows {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #1e1e1e;
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid #333;
        }
        .nav-btn {
            background-color: transparent;
            color: #ffffff;
            border: none;
            font-size: 32px;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0 10px;
        }
        .nav-btn:hover {
            color: #4CAF50;
        }
        #counter {
            font-size: 18px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Battlefield 2: Project Reality (2013) - AI Restoration</h2>
    <p>Original 540p Twitch VOD (Left) vs. 1080p GameUpV2 Upscale (Right)</p>
    
    <img-comparison-slider>
      <img slot="first" id="img-original" src="512.png" alt="Original 540p" />
      <img slot="second" id="img-upscaled" src="512_up.jpg" alt="Upscaled 1080p" />
    </img-comparison-slider>

    <!-- Arrow Navigation -->
    <div class="nav-arrows">
        <button class="nav-btn" id="prevBtn" title="Previous Image">&#10094;</button>
        <span id="counter">1 / 12</span>
        <button class="nav-btn" id="nextBtn" title="Next Image">&#10095;</button>
    </div>

    <script>
        // Exact filename mapping
        const fileMap = {
            "512": "512_up.jpg",
            "954": "954_up.jpg",
            "1302": "1302_up.jpg",
            "1629": "1629_up.jpg",
            "1815": "1815_up.jpg",
            "3119": "3119_up.jpg",
            "3858": "3858_up.jpg",
            "4707": "4707_up.jpg",
            "4752": "4752_up.jpg",
            "5948": "5948_up.jpg",
            "10009": "10009_Up.jpg",
            "100012": "100012_up.jpg"
        };

        const keys = Object.keys(fileMap);
        let currentIndex = 0;

        const imgOriginal = document.getElementById('img-original');
        const imgUpscaled = document.getElementById('img-upscaled');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('counter');

        function updateSlider() {
            const baseName = keys[currentIndex];
            imgOriginal.src = baseName + ".png";
            imgUpscaled.src = fileMap[baseName];
            counter.innerText = (currentIndex + 1) + " / " + keys.length;
        }

        prevBtn.addEventListener('click', () => {
            // Loop back to the end if clicking previous on the first image
            currentIndex = (currentIndex - 1 + keys.length) % keys.length;
            updateSlider();
        });

        nextBtn.addEventListener('click', () => {
            // Loop back to the start if clicking next on the last image
            currentIndex = (currentIndex + 1) % keys.length;
            updateSlider();
        });
    </script>
</body>
</html>
